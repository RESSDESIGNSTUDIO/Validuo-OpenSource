name: CI rerun after timeout

# When a CI run fails because a step was cancelled by a timeout (a hung download, a stuck runner),
# re-run its failed jobs once. Genuine failures (a failing step, not a cancelled one) are left
# alone, so real test failures are never retried or hidden.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: Re-run once after a timeout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    steps:
      - name: Re-run failed jobs if a step timed out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          cancelled=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[].steps[]? | select(.conclusion == "cancelled")] | length')
          if [ "$cancelled" -gt 0 ]; then
            echo "$cancelled step(s) were cancelled by a timeout; re-running failed jobs."
            gh run rerun "$RUN_ID" --failed --repo "$REPO"
          else
            echo "No timed-out steps; leaving the failure as it is."
          fi
